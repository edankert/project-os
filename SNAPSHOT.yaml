version: 1
updated: "2026-07-05T01:00Z"

template:
  replace_me: true
  note: "Template agent snapshot. Run tools/skills/project-init/SKILL.md to initialize for a real project."

project:
  name: "REPLACE ME"
  summary: "REPLACE ME"
  repo_root: "REPLACE ME"

# Optional session metadata for recovery/multi-agent coordination.
# session:
#   agent_id: "agent-identifier"
#   started: "2026-01-29T12:00Z"
#   last_heartbeat: "2026-01-29T12:30Z"
#   current_step: "Drafting feature notes for existing project import"
#
# Optional team model for multi-user/multi-agent projects.
# Agent coordination is handled by your tool's native orchestration
# (e.g., Claude Code Agent Teams, Codex parallel agents).
# team:
#   members:
#     - id: user:edwin
#       tool: claude-code
#       adapter: tools/adapters/claude-code
#     - id: user:alice
#       tool: codex
#       adapter: tools/adapters/codex

retention:
  policy: active-and-recent
  recent_changes_max: 25
  keep_closed_issues_in_snapshot: false
  keep_done_tasks_in_snapshot: false
  keep_done_features_in_snapshot: false
  note: "Snapshot keeps active work + recent changes for handoff; notes are the archive."

docs_system:
  source_of_truth: SNAPSHOT.yaml
  instructions:
    - tools/instructions/OBSIDIAN.md
    - tools/instructions/MARKDOWN.md
    - tools/instructions/LIFECYCLE.md
  references:
    - docs/PHASES.md           # Phase registry (optional phase-gated development)
    - docs/__bases__/NAVIGATION.base # Optional Obsidian navigation view
    - docs/__bases__/CONTEXT.base    # Optional Obsidian active-note context view
    - docs/reference/README.md # Optional non-lifecycle reference/source documentation area
    - tools/cockpit/README.md  # Optional local docs cockpit browser

# ID allocation helpers (highest allocated numbers).
counters:
  ADR: 0
  CHG:
    last_date: 0
  FEAT: 0
  ISS: 0
  PHASE: 0
  REQ: 0
  RISK: 0
  REL: 0
  TASK: 0
  TST: 0
  WF: 3 # WF-0001..0003 ship with the template under docs/workflows/

# Current focus (set when something is actively being worked).
focus:
  phase: ""        # Active development phase (PHASE-### note link/ID preferred)
  feature: ""
  task: ""
  issue: ""

# Canonical state for tracked items (empty for a fresh template).
items:
  features: {}
  tasks: {}
  issues: {}
  requirements: {}
  phases: {}
  risks: {}
  tests: {}
  releases: {}
  workflows: {}
  changes: {}
  decisions: {}

# Latest release context for agents (lightweight; full history in REL-* notes).
# releases:
#   latest:
#     id: REL-0001
#     version: "1.0.0"
#     tag: v1.0.0
#     date: "2026-03-08"
#     status: released
#   history:
#     - { id: REL-0001, version: "1.0.0", date: "2026-03-08", status: released }

metrics:
  counts:
    features_total: 0
    features_done: 0
    phases_total: 0
    phases_done: 0
    tasks_total: 0
    tasks_done: 0
    tests_total: 0
    tests_passing: 0
    tests_failing: 0
    issues_open: 0
    issues_triage: 0
    risks_open: 0
    releases_total: 0
    decisions_total: 0
